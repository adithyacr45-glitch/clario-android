name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Create test signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/clario-test.jks" \
            -storepass clario-test-2026 \
            -keypass clario-test-2026 \
            -alias clario-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=CLARIO Test Build, O=CLARIO, C=IN"

      - name: Sign installable APK
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name '*-unsigned.apk' -o -name '*.apk' | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/clario-test.jks" \
            --ks-pass pass:clario-test-2026 \
            --key-pass pass:clario-test-2026 \
            --ks-key-alias clario-test \
            --out app/build/outputs/apk/release/CLARIO-v1.0.3-test.apk \
            "$UNSIGNED_APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            app/build/outputs/apk/release/CLARIO-v1.0.3-test.apk

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: clario-android-v1.0.3
          path: |
            app/build/outputs/apk/release/CLARIO-v1.0.3-test.apk
            app/build/outputs/bundle/release/*.aab
